openapi: 3.0.3
info:
  title: Mirelo AI API
  version: 2.0.0
  description: |-
    The Mirelo API lets you add AI-generated audio to video. You can generate sound effects from a text prompt or directly from a video, using the audio-visual context of the footage to create matching sounds. Results are returned as audio URLs ready to mix or play back.

    ## Authentication

    All requests require an API key passed as a Bearer token:

    ```
    Authorization: Bearer sk-your-key-here
    ```

    Keys begin with `sk-`. You can generate keys in the [Mirelo dashboard](https://studio.mirelo.ai/api-keys).

    ## Credits

    Generation costs credits. The number of credits consumed depends on the generation type, the duration requested, and the number of samples. Credits are deducted only on success — failed or errored generations are not charged. Use the `/preflight` endpoint on any generation route to see the exact cost before committing.

    ## Pricing

    Credit costs vary by model. For full model pricing details — including credits per second for each model — see the [Mirelo pricing page](https://www.mirelo.ai/pricing).

    ## Sync vs Async

    Every generation endpoint has two modes: **sync** and **async**.

    - **`/sync`** blocks until generation completes and returns audio URLs directly. Simple — one request, one response. Suitable for short durations (≤ 10 seconds) and server-side scripts. Note: HTTP connections time out after ~30 seconds in most environments, so sync is unreliable for longer generations.
    - **`/jobs`** returns immediately with a `job_id` and an estimated completion time. Poll `GET .../jobs/{job_id}` until `status` is `"succeeded"` or `"errored"`. Recommended for browser environments, longer durations, and production integrations where you need a responsive UI.

    **Rule of thumb:** use `/sync` for `duration_ms` ≤ 10000 and `/jobs` for anything longer.

    ## Preflight

    Before triggering generation, call `GET .../preflight` on any generation endpoint to get the exact credit cost and estimated duration. Use it to confirm costs in your UI or build a progress bar.

    `credits` is exact and will match what gets deducted if you proceed. `estimated_ms` is a statistical estimate calibrated to cover ~98% of real jobs at that duration.

    ## Model Versions

    The model version is part of the URL path (e.g., `/v2/text-to-sfx/v1.5/sync`). Each model version has its own parameter contract. Pin the version you want — requesting an unsupported version returns `404`.

    ## Errors

    All errors follow a consistent shape:

    ```json
    { "error": { "code": "insufficient_credits", "message": "...", "http_status": 402 } }
    ```

    `code` is always one of a defined set of values (listed below), so you can branch on it reliably. Internal error details are never leaked.

    Standard HTTP status codes apply: `400` for bad input, `401` for missing or invalid key, `402` for insufficient credits, `404` for unknown resource or job, `422` for generation failures, `500` for unexpected server errors.

    **Error codes:**

    | Code | HTTP | Description |
    |------|------|-------------|
    | `invalid_request` | 400 | Bad input — check your parameters |
    | `video_url_unreachable` | 400 | Video URL returned a non-2xx response during the video URL check — check the URL is public and has not expired |
    | `video_format_unsupported` | 400 | Video container not recognized — supported containers are MP4, MOV, WebM, and MKV |
    | `video_too_short` | 400 | Video is shorter than `start_offset_ms` + `duration_ms` — the error message includes the exact lengths |
    | `invalid_video` | 422 | Video could not be decoded by the generation service — use H.264, VP8, or VP9 and ensure the file is not corrupted |
    | `invalid_asset` | 422 | Asset not found or inaccessible |
    | `insufficient_credits` | 402 | Not enough credits — top up your balance |
    | `generation_failed` | 502 | Upstream generation error — retry or contact support |
    | `generation_timeout` | 504 | Job took too long — retry or contact support |
    | `job_not_found` | 404 | Job doesn't exist, has expired (24h TTL), or belongs to another key |
    | `server_error` | 500 | Unexpected server error — retry or contact support |

    ## Video Input

    All video endpoints accept two ways to provide a video:

    - **URL** — pass `{type: "url", video_url: "https://..."}`. The URL must be publicly accessible (no auth required). See the Video URL Check section for supported formats and hosting recommendations.
    - **Asset** — pre-upload your video in three steps:
      1. Call `POST /v2/assets` to create an asset. The response contains an `asset_id` and a pre-signed `upload_url`.
      2. Upload your video file directly to the `upload_url` via an HTTP `PUT` request (no API key needed — the URL is pre-signed).
      3. Use the `asset_id` from step 1 in your generation request: `{type: "asset", asset_id: "..."}`.

      Asset IDs stay valid for **24 hours** after upload.

    Use assets when your video is not publicly accessible, when you want to avoid re-uploading the same file for multiple generation calls, or when your URL is a short-lived signed token that may expire before the generation runs.

    ## Video URL Check

    All video endpoints (`video-to-sfx`) perform a lightweight video URL check before dispatching to any generation service. This catches common problems early and returns a clear error before any credits are at risk.

    **What the check does:**

    The API fetches the first 128 KB of your video via an HTTP Range request. From those bytes it:

    1. Verifies the URL returns a 2xx response (`video_url_unreachable` if not)
    2. Identifies the container format from the file header (`video_format_unsupported` if unrecognized)
    3. Parses the container's duration header and validates it covers `start_offset_ms` + `duration_ms` (`video_too_short` if not — the error message includes the exact values)

    **Supported containers:** MP4, MOV, M4V, WebM, MKV. These cover the vast majority of real-world video files.

    **Hosting recommendations:**

    - Use S3, Google Cloud Storage, Cloudflare R2, or any major CDN — all support HTTP Range requests and respond quickly
    - Avoid URLs that require cookies, auth headers, or short-lived signed tokens that may expire between the video URL check and the generation call
    - If your MP4 was encoded without web-optimisation (`moov` atom at end of file), the check may fall back to a second range fetch; this still resolves well within the timeout on any CDN
    - If you see `video_format_unsupported` for a valid MP4, re-encode with: `ffmpeg -i input.mp4 -c copy -movflags faststart output.mp4`

    ## SDKs

    Official SDKs are available for Node.js/TypeScript and Python:

    - **Node.js / TypeScript** — [`@mirelo/sdk`](https://www.npmjs.com/package/@mirelo/sdk): `npm install @mirelo/sdk`
    - **Python** — [`mirelo-sdk`](https://pypi.org/project/mirelo-sdk/): `pip install mirelo-sdk`

    Source and full documentation: [github.com/mirelo-ai/sdk](https://github.com/mirelo-ai/sdk)
