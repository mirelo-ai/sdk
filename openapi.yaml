                      properties:
                        type:
                          type: string
                          enum:
                            - url
                        video_url:
                          type: string
                          format: uri
                          description: 'Publicly accessible video URL (no auth required). Supported containers: MP4, MOV, WebM, MKV. A video URL check is performed before generation — see the Video URL Check section.'
                    - title: Asset
                      type: object
                      required:
                        - type
